<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpenClaw Backup</title><style>body{font:17px/1.8 system-ui,sans-serif;max-width:760px;margin:60px auto;padding:0 24px;color:#222}nav{margin-top:32px}a{color:#245cad}</style><main><h1>OpenClaw Backup</h1><p>개인 서버의 OpenClaw 설정과 상태 데이터를 암호화하여 계정 소유자의 Google Drive에 보관하는 개인용 백업 도구입니다.</p><p>일반 사용자 가입을 받지 않으며, 서버 소유자만 자신의 Google 계정으로 연결합니다. 이 페이지에는 백업 파일이나 복구 키가 제공되지 않습니다.</p><p>백업 도구는 자신이 만든 Drive 파일에만 접근하는 drive.file 권한을 사용합니다.</p><nav><a href="index.html">소개</a> · <a href="privacy.html">개인정보 안내</a> · <a href="terms.html">사용 안내</a></nav><p>최종 수정: 2026-09-21</p></main></html>
